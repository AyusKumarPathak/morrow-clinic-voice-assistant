[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-voice-assistant-backend"
version = "1.0.0"
description = "Voice-first doctor appointment assistant built with Pipecat, ElevenLabs and Gemini."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pipecat-ai[webrtc,runner,elevenlabs,google,silero]>=1.14.0,<2.0.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
